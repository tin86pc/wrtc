<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebRTC — Giao tiếp trực tiếp P2P</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#121212;color:#fff;padding:15px;max-width:900px;margin:0 auto}
h1{text-align:center;margin-bottom:20px;font-size:1.4rem;color:#4ade80}
.box{background:#1e1e1e;border-radius:10px;padding:15px;margin-bottom:15px}
h2{font-size:1rem;margin-bottom:10px;color:#94a3b8}
video{width:100%;background:#000;border-radius:8px;margin:5px 0;max-height:220px;object-fit:cover}
textarea{width:100%;height:110px;background:#2d2d2d;color:#fff;border:none;border-radius:6px;padding:10px;margin:8px 0;resize:vertical;font-family:monospace;font-size:11px}
input{width:100%;padding:10px;background:#2d2d2d;border:none;border-radius:6px;color:#fff;margin:5px 0}
button{padding:10px 14px;border:none;border-radius:6px;font-weight:600;cursor:pointer;margin:4px;font-size:14px}
button:disabled{opacity:0.4;cursor:not-allowed}
.btn-primary{background:#22c55e;color:#fff}
.btn-secondary{background:#3b82f6;color:#fff}
.btn-warning{background:#f59e0b;color:#000}
.btn-danger{background:#ef4444;color:#fff}
#chatLog{height:150px;overflow-y:auto;background:#252525;border-radius:6px;padding:10px;margin:8px 0;font-size:14px}
.msg{margin:6px 0;padding:6px 10px;border-radius:16px;max-width:80%}
.them{background:#3b82f6}
.ta{background:#22c55e;margin-left:auto}
.status{padding:10px 12px;border-radius:6px;margin:8px 0;font-weight:500;font-size:13px}
.connected{background:#166534}
.waiting{background:#854d0e}
.error{background:#991b1b}
.ok{background:#164e63}
.hint{font-size:12px;color:#94a3b8;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
</style>
</head>
<body>

<h1>🔗 WebRTC — Giao tiếp trực tiếp P2P</h1>

<div class="box">
  <h2>📹 Video & Âm thanh</h2>
  <div id="camStatus" class="status waiting">Chưa bật camera</div>
  <video id="localVideo" autoplay muted playsinline></video>
  <video id="remoteVideo" autoplay playsinline></video>
  
  <div class="row" style="margin-top:10px">
    <button id="startCam" class="btn-primary">Bật Camera</button>
    <button id="stopCam" class="btn-danger" disabled>Tắt Camera</button>
  </div>
  <p class="hint">💡 Đã sửa lỗi SDP — tự lọc dòng không hợp lệ</p>
</div>

<div class="box">
  <h2>🔄 Kết nối — Copy & Paste SDP</h2>
  <div id="status" class="status waiting">Chưa kết nối</div>
  
  <div>
    <button id="btnCreateOffer" class="btn-primary">1. Tạo Mã Kết Nối (Bên Gọi)</button>
  </div>
  
  <label>📤 Sao chép khối dưới gửi sang bên kia:</label>
  <textarea id="mySDP" readonly placeholder="Nhấn Tạo Mã → mã hiện ngay ở đây"></textarea>
  
  <label>📥 Dán mã của người kia vào đây:</label>
  <textarea id="remoteSDP" placeholder="Dán SDP người nhận vào đây → nhấn Kết Nối"></textarea>
  
  <div class="row">
    <button id="btnConnect" class="btn-secondary">2. Kết Nối / Trả Lời</button>
    <button id="btnClear" class="btn-warning">Xóa Dữ Liệu</button>
  </div>
  <p class="hint">💡 Tự sửa lỗi định dạng khi dán mã</p>
</div>

<div class="box">
  <h2>💬 Tin Nhắn</h2>
  <div id="chatLog"></div>
  <div style="display:flex;gap:8px">
    <input id="msgInput" placeholder="Nhập tin nhắn..." disabled>
    <button id="sendBtn" class="btn-primary" disabled>Gửi</button>
  </div>
</div>

<script>
// === Cấu hình đúng chuẩn ===
const config = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { 
      urls: 'turn:relay.metered.ca:80?transport=udp',
      username: 'open',
      credential: 'open'
    },
    { 
      urls: 'turn:relay.metered.ca:443?transport=tcp',
      username: 'open',
      credential: 'open'
    }
  ]
};

// === Làm sạch SDP — XÓA dòng gây lỗi ===
function cleanSDP(sdp) {
  if (!sdp) return sdp;
  return sdp
    .split('\n')
    .filter(line => {
      const trimmed = line.trim();
      // Bỏ dòng gây lỗi
      if (trimmed.startsWith('a=max-message-size')) return false;
      return true;
    })
    .join('\n');
}

// === Biến ===
let pc = null;
let localStream = null;
let dataChannel = null;
let isInitiator = false;

// === Phần tử ===
const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');
const startCamBtn = document.getElementById('startCam');
const stopCamBtn = document.getElementById('stopCam');
const btnCreateOffer = document.getElementById('btnCreateOffer');
const btnConnect = document.getElementById('btnConnect');
const mySDP = document.getElementById('mySDP');
const remoteSDP = document.getElementById('remoteSDP');
const statusEl = document.getElementById('status');
const camStatusEl = document.getElementById('camStatus');
const chatLog = document.getElementById('chatLog');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const btnClear = document.getElementById('btnClear');

// === Cập nhật trạng thái ===
function setStatus(el, text, type) {
  el.className = `status ${type}`;
  el.textContent = text;
}

// === Bật Camera ===
startCamBtn.addEventListener('click', async () => {
  try {
    setStatus(camStatusEl, '⏳ Đang yêu cầu quyền...', 'waiting');
    localStream = await navigator.mediaDevices.getUserMedia({ 
      video: { width: { ideal: 1280 }, height: { ideal: 720 } }, 
      audio: true 
    });
    localVideo.srcObject = localStream;
    startCamBtn.disabled = true;
    stopCamBtn.disabled = false;
    setStatus(camStatusEl, '✅ Camera đã sẵn sàng', 'ok');
  } catch (err) {
    setStatus(camStatusEl, `⚠️ Không có camera: ${err.message}`, 'error');
  }
});

// === Tắt Camera ===
stopCamBtn.addEventListener('click', () => {
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  localVideo.srcObject = null;
  remoteVideo.srcObject = null;
  startCamBtn.disabled = false;
  stopCamBtn.disabled = true;
  setStatus(camStatusEl, 'Đã tắt', 'waiting');
  if (pc) { pc.close(); pc = null; }
  setStatus(statusEl, 'Chưa kết nối', 'waiting');
});

// === Tạo kết nối P2P ===
function createPeerConnection() {
  pc = new RTCPeerConnection(config);
  
  if (localStream) {
    localStream.getTracks().forEach(track => {
      pc.addTrack(track, localStream);
    });
  }
  
  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };
  
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      setStatus(statusEl, '✅ ĐÃ KẾT NỐI — Truyền trực tiếp!', 'connected');
      msgInput.disabled = false;
      sendBtn.disabled = false;
    } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
      setStatus(statusEl, '⚠️ Mất kết nối', 'error');
    }
  };
  
  pc.onicecandidate = (e) => {
    if (pc.localDescription && pc.localDescription.sdp) {
      // Làm sạch SDP trước khi hiển thị
      mySDP.value = cleanSDP(pc.localDescription.sdp);
      if (!e.candidate) {
        setStatus(statusEl, '✅ Mã đầy đủ — Copy & Gửi!', 'ok');
      }
    }
  };
  
  pc.ondatachannel = (event) => {
    dataChannel = event.channel;
    setupDataChannel();
  };
  
  return pc;
}

// === Kênh tin nhắn ===
function setupDataChannel() {
  dataChannel.onmessage = (e) => {
    appendMessage(e.data, 'them');
  };
  dataChannel.onopen = () => {
    msgInput.disabled = false;
    sendBtn.disabled = false;
  };
  dataChannel.onclose = () => {
    msgInput.disabled = true;
    sendBtn.disabled = true;
  };
}

// === Tạo Offer ===
btnCreateOffer.addEventListener('click', async () => {
  try {
    isInitiator = true;
    setStatus(statusEl, '⏳ Đang tạo mã...', 'waiting');
    
    createPeerConnection();
    dataChannel = pc.createDataChannel('chat');
    setupDataChannel();
    
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    
    mySDP.value = cleanSDP(pc.localDescription.sdp);
    setStatus(statusEl, '✅ Mã đã sẵn sàng — Copy & Gửi!', 'ok');
    
  } catch (err) {
    setStatus(statusEl, `❌ Lỗi: ${err.message}`, 'error');
    alert('Chi tiết lỗi: ' + err.message);
  }
});

// === Kết nối / Trả lời ===
btnConnect.addEventListener('click', async () => {
  let sdpText = remoteSDP.value.trim();
  if (!sdpText) {
    alert('Vui lòng dán SDP của người kia trước!');
    return;
  }
  
  // === LÀM SẠCH SDP TRƯỚC KHI XỬ LÝ ===
  sdpText = cleanSDP(sdpText);
  
  try {
    if (!pc) createPeerConnection();
    
    const type = isInitiator ? 'answer' : 'offer';
    const remoteDesc = new RTCSessionDescription({ type, sdp: sdpText });
    
    await pc.setRemoteDescription(remoteDesc);
    
    if (!isInitiator) {
      setStatus(statusEl, '⏳ Đang tạo phản hồi...', 'waiting');
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      mySDP.value = cleanSDP(pc.localDescription.sdp);
      setStatus(statusEl, '✅ Mã phản hồi — Copy & Gửi lại!', 'ok');
    }
  } catch (err) {
    alert(`Lỗi kết nối: ${err.message}`);
    setStatus(statusEl, `❌ ${err.message}`, 'error');
  }
});

// === Hiển thị tin nhắn ===
function appendMessage(text, who) {
  const div = document.createElement('div');
  div.className = `msg ${who}`;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

// === Gửi tin nhắn ===
function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || !dataChannel || dataChannel.readyState !== 'open') return;
  dataChannel.send(text);
  appendMessage(text, 'ta');
  msgInput.value = '';
}
sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => e.key === 'Enter' && sendMessage());

// === Xóa ===
btnClear.addEventListener('click', () => {
  mySDP.value = '';
  remoteSDP.value = '';
  chatLog.innerHTML = '';
  isInitiator = false;
});
</script>
</body>
</html>
